name: Theme build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - run: node scripts/check-css-conventions.mjs --self-test
      - run: npm run lint:css
      - run: npm run build
